<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 19.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 12.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .actor-lbl { font-family: 'Times New Roman', serif; font-size: 14.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .msg-txt { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .guard-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; }
      .frame-lbl { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .footer-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .line { stroke: #000000; stroke-width: 1.6; fill: none; }
      .lifeline { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 4,4; fill: none; }
      .activation { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; }
      .frame-box { fill: none; stroke: #000000; stroke-width: 1.3; }
      .divider { stroke: #000000; stroke-width: 1.1; stroke-dasharray: 4,4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Trang A4 Nền Trắng & Khung Viền -->
  <rect x="0" y="0" width="840" height="1188" fill="#FFFFFF"/>
  <rect x="25" y="25" width="790" height="1138" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Tiêu Đề -->
  <text x="420.0" y="58" class="title">SƠ ĐỒ TUẦN TỰ: XỬ LÝ THANH TOÁN VÀ SEPAY WEBHOOK (15 PHÚT)</text>
  <text x="420.0" y="80" class="subtitle">Đặc tả quy trình nghiệp vụ 05 | Chuẩn UML 2.x | Hệ thống AURALIÈ | Hình 5 / 8</text>
  <line x1="45" y1="94" x2="795" y2="94" class="line"/>

  <!-- LIFELINE HEADERS -->
  
            <circle cx="160" cy="112" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="122" x2="160" y2="142" stroke="#000000" stroke-width="1.8"/>
            <line x1="146" y1="130" x2="174" y2="130" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="142" x2="148" y2="158" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="142" x2="172" y2="158" stroke="#000000" stroke-width="1.8"/>
            <text x="160" y="176" class="actor-lbl">Khách hàng</text>
            
  
            <rect x="345" y="118" width="150" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <text x="420" y="143" class="actor-lbl">Hệ thống</text>
            
  
            <path d="M 620 122 A 60 12 0 0 0 740 122 L 740 148 A 60 12 0 0 1 620 148 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <ellipse cx="680" cy="122" rx="60" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <text x="680" y="145" class="actor-lbl">Cơ sở dữ liệu</text>
            

  <!-- LIFELINES (Vertical Dashed Lines) -->
  <line x1="160" y1="185" x2="160" y2="1080" class="lifeline"/>
  <line x1="420" y1="185" x2="420" y2="1080" class="lifeline"/>
  <line x1="680" y1="185" x2="680" y2="1080" class="lifeline"/>

  <!-- NỘI DUNG TƯƠNG TÁC NGHIỆP VỤ -->
  
    <rect x="154" y="210" width="12" height="740" class="activation"/>
    <rect x="414" y="210" width="12" height="740" class="activation"/>

    <!-- Alt: Payment Methods -->
    <rect x="55" y="225" width="730" height="650" class="frame-box"/>
    <polygon points="55,225 115,225 115,240 95,240 95,225" fill="#F4F4F4" stroke="#000000" stroke-width="0.8"/>
    <text x="65" y="237" class="frame-lbl">alt</text>
    <text x="125" y="237" class="guard-txt">[Phương thức COD - Thanh toán tiền mặt khi nhận hàng]</text>

    <rect x="674" y="245" width="12" height="90" class="activation"/>

    <line x1="426" y1="265" x2="674" y2="265" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="259" class="msg-txt">[01] Cập nhật dữ liệu: UPDATE orders SET status='CONFIRMED', payment_status='UNPAID'</text>

    <line x1="674" y1="300" x2="426" y2="300" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="294" class="msg-txt">[02] Trả kết quả: Xác nhận cập nhật thành công (Rows affected = 1)</text>

    <line x1="414" y1="330" x2="166" y2="330" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="324" class="msg-txt">[03] Phản hồi thành công: 200 OK ("Đặt hàng COD thành công, chuẩn bị đóng gói")</text>

    <!-- Nhánh VietQR -->
    <line x1="55" y1="355" x2="785" y2="355" class="divider"/>
    <text x="125" y="370" class="guard-txt">[Phương thức VietQR SePay: Khách hàng chuyển khoản ngân hàng tự động]</text>

    <line x1="166" y1="400" x2="414" y2="400" class="line" marker-end="url(#arrow)"/>
    <text x="175" y="394" class="msg-txt">[04] Khách hàng chuyển khoản qua ứng dụng ngân hàng (Nội dung chuyển là order_code)</text>

    <path d="M 426 415 L 455 415 L 455 437 L 426 437" class="line" marker-end="url(#arrow)"/>
    <text x="462" y="429" class="msg-txt">[05] Tiếp nhận Webhook từ SePay: POST /api/v1/sepay/webhook (Xác thực API Key)</text>

    <rect x="674" y="440" width="12" height="370" class="activation"/>

    <line x1="426" y1="460" x2="674" y2="460" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="454" class="msg-txt">[06] Truy vấn dữ liệu: SELECT * FROM orders WHERE order_code = @order_code</text>

    <line x1="674" y1="495" x2="426" y2="495" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="489" class="msg-txt">[07] Trả kết quả: Thông tin đơn hàng và tổng tiền cần thanh toán</text>

    <!-- Sub-alt VietQR -->
    <rect x="110" y="515" width="665" height="330" class="frame-box"/>
    <polygon points="110,515 160,515 160,529 145,529 145,515" fill="#F4F4F4" stroke="#000000" stroke-width="0.8"/>
    <text x="115" y="527" class="frame-lbl">alt</text>
    <text x="170" y="527" class="guard-txt">[Khách hàng chuyển đủ tiền trong vòng 15 phút]</text>

    <line x1="426" y1="555" x2="674" y2="555" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="549" class="msg-txt">[08] Thêm dữ liệu payments &amp; Cập nhật: payment_status='PAID', status='CONFIRMED'</text>

    <line x1="674" y1="585" x2="426" y2="585" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="579" class="msg-txt">[09] Trả kết quả: Cập nhật thanh toán thành công</text>

    <line x1="414" y1="610" x2="166" y2="610" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="604" class="msg-txt">[10] Phản hồi: Thông báo đẩy ("Thanh toán thành công! Đơn hàng đã được xác nhận")</text>

    <!-- Sub-alt Expired -->
    <line x1="110" y1="630" x2="775" y2="630" class="divider"/>
    <text x="170" y="645" class="guard-txt">[Quá 15 phút không thanh toán hoặc chuyển thiếu tiền (UNPAID / PARTIALLY_PAID)]</text>

    <line x1="426" y1="680" x2="674" y2="680" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="674" class="msg-txt">[11] Tiến trình quét đơn tự động (expiredOrders.job): UPDATE orders SET status='CANCELLED'</text>

    <line x1="426" y1="720" x2="674" y2="720" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="714" class="msg-txt">[12] Hoàn tác tồn kho nguyên tử: UPDATE product_variants SET stock = stock + qty</text>

    <line x1="674" y1="755" x2="426" y2="755" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="749" class="msg-txt">[13] Trả kết quả: Hoàn tất hủy đơn hàng và hoàn lại số lượng tồn kho</text>

    <line x1="414" y1="785" x2="166" y2="785" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="779" class="msg-txt">[14] Phản hồi: Thông báo ("Đơn hàng đã tự động bị hủy do quá hạn 15 phút")</text>
    

  <!-- FOOTER CHUẨN A4 -->
  <line x1="45" y1="1085" x2="795" y2="1085" class="line"/>
  <rect x="105" y="1092" width="110" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="160" y="1111" class="actor-lbl">Khách hàng</text>

  <rect x="360" y="1092" width="120" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="420" y="1111" class="actor-lbl">Hệ thống</text>

  <rect x="615" y="1092" width="130" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="680" y="1111" class="actor-lbl">Cơ sở dữ liệu</text>

  <text x="420.0" y="1145" class="footer-txt">Báo Cáo Đồ Án Tốt Nghiệp: Hệ Thống Thương Mại Điện Tử May Đo AURALIÈ | Chuẩn UML 2.x Sequence Diagram</text>
</svg>