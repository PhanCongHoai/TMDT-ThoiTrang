  <!-- Footer Chú Thích Chuẩn UML 2.x -->
  <line x1="50" y1="1055" x2="790" y2="1055" class="line"/>
  <rect x="50" y="1062" width="740" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
