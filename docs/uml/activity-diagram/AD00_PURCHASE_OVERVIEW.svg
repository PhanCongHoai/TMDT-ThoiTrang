<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 19px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #000000; text-anchor: middle; }
      .act-txt { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .dec-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .guard-txt { font-family: 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .leg-lbl { font-family: 'Times New Roman', serif; font-size: 11px; fill: #000000; }
      .line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .action-rect { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; rx: 10px; ry: 10px; }
      .decision-diamond { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; }
      .sync-bar { fill: #000000; stroke: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="1188" fill="#FFFFFF"/>
  <rect x="25" y="25" width="790" height="1138" fill="none" stroke="#000000" stroke-width="1"/>

  <text x="420.0" y="62" class="title">Sơ đồ tổng quan quy trình mua hàng</text>
  <text x="420.0" y="85" class="subtitle">Đặc tả quy trình hoạt động (UML 2.x Activity Diagram) | Mã sơ đồ: AD00_PURCHASE_OVERVIEW | Trang 1 / 7</text>
  <line x1="50" y1="98" x2="790" y2="98" class="line"/>

  <rect x="50" y="115" width="740" height="925" fill="none" stroke="#000000" stroke-width="1.8"/>
  
        <rect x="50.0" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="173.33333333333331" y="136" font-family="'Times New Roman', serif" font-size="13px" font-weight="bold" fill="#000000" text-anchor="middle">Khách hàng (Customer)</text>
        <line x1="50.0" y1="147" x2="50.0" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        
        <rect x="296.66666666666663" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="419.99999999999994" y="136" font-family="'Times New Roman', serif" font-size="13px" font-weight="bold" fill="#000000" text-anchor="middle">Giao diện web (Storefront)</text>
        <line x1="296.66666666666663" y1="147" x2="296.66666666666663" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        
        <rect x="543.3333333333333" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="666.6666666666666" y="136" font-family="'Times New Roman', serif" font-size="13px" font-weight="bold" fill="#000000" text-anchor="middle">Hệ thống xử lý &amp; CSDL (Backend)</text>
        <line x1="543.3333333333333" y1="147" x2="543.3333333333333" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line x1="790" y1="147" x2="790" y2="1040" stroke="#000000" stroke-width="1.2"/>

  
    <!-- Initial Node -->
    <circle cx="173" cy="170" r="9" fill="#000000"/>
    <line x1="173" y1="179" x2="173" y2="200" class="line" marker-end="url(#arrow)"/>

    <!-- Bước 1: Khám phá sản phẩm -->
    
    <rect x="73" y="200" width="200" height="42" class="action-rect"/>
    <text x="173.0" y="216.5" class="act-txt">1. Truy cập website và</text>
<text x="173.0" y="233.5" class="act-txt">khám phá sản phẩm</text>

    
    <line x1="173" y1="242" x2="173" y2="265" class="line" marker-end="url(#arrow)"/>

    <!-- Bước 2: Chọn thêm sản phẩm -->
    
    <rect x="73" y="265" width="200" height="42" class="action-rect"/>
    <text x="173.0" y="281.5" class="act-txt">2. Chọn thêm sản phẩm</text>
<text x="173.0" y="298.5" class="act-txt">vào giỏ hàng</text>

    
    
    <!-- ĐƯỜNG NỐI TỪ BƯỚC 2: RA TỪ CẠNH PHẢI (273, 286), CHẠY SANG CỘT x=420, RỒI CẮM VUÔNG GÓC XUỐNG ĐỈNH HÌNH THOI (420, 312) -->
    <line x1="273" y1="286" x2="420" y2="286" class="line"/>
    <line x1="420" y1="286" x2="420" y2="312" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 1: Khách đã đăng nhập? (Đặt tại cx=420, cy=340, rx=65, ry=28) -->
    
    <polygon points="420,312 485,340 420,368 355,340" class="decision-diamond"/>
    <text x="420" y="336.5" class="dec-txt">Khách đã</text>
<text x="420" y="351.5" class="dec-txt">đăng nhập?</text>

    

    <!-- Nhánh Chưa đăng nhập: Ra từ CẠNH TRÁI hình thoi (355, 340) -> đi sang trái x=173 -> cắm xuống đỉnh Action Đăng nhập tại (173, 385) -->
    <line x1="355" y1="340" x2="173" y2="340" class="line"/>
    <line x1="173" y1="340" x2="173" y2="385" class="line" marker-end="url(#arrow)"/>
    
    <rect x="244.0" y="321" width="42.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="265" y="333" class="guard-txt">[Chưa]</text>
    

    
    <rect x="73" y="385" width="200" height="42" class="action-rect"/>
    <text x="173.0" y="401.5" class="act-txt">Đăng nhập / đăng ký</text>
<text x="173.0" y="418.5" class="act-txt">tài khoản hội viên</text>

    
    
    <!-- Đăng nhập xong: Đi từ đáy (173, 427) -> xuống y=455 -> sang phải cắm vào cạnh trái Bước 3 tại (320, 455) -->
    <line x1="173" y1="427" x2="173" y2="455" class="line"/>
    <line x1="173" y1="455" x2="320" y2="455" class="line" marker-end="url(#arrow)"/>

    <!-- Nhánh Đã đăng nhập: Ra từ ĐÁY hình thoi (420, 368) -> cắm thẳng xuống đỉnh Bước 3 tại (420, 435) -->
    <line x1="420" y1="368" x2="420" y2="435" class="line" marker-end="url(#arrow)"/>
    
    <rect x="431.5" y="386" width="27.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="445" y="398" class="guard-txt">[Đã]</text>
    

    <!-- Bước 3: Lưu giỏ hàng (y=435 to y=477, midpoint left=(320, 455)) -->
    
    <rect x="320" y="435" width="200" height="42" class="action-rect"/>
    <text x="420.0" y="451.5" class="act-txt">3. Lưu sản phẩm vào</text>
<text x="420.0" y="468.5" class="act-txt">giỏ hàng thành viên</text>

    
    <line x1="420" y1="477" x2="420" y2="500" class="line" marker-end="url(#arrow)"/>

    <!-- Bước 4: Kiểm tra giỏ hàng -->
    
    <rect x="320" y="500" width="200" height="42" class="action-rect"/>
    <text x="420.0" y="516.5" class="act-txt">4. Giao diện kiểm tra và</text>
<text x="420.0" y="533.5" class="act-txt">cập nhật giỏ hàng</text>

    
    <line x1="420" y1="542" x2="420" y2="565" class="line" marker-end="url(#arrow)"/>

    <!-- Bước 5: Bấm kiểm tra đơn hàng -->
    
    <rect x="320" y="565" width="200" height="42" class="action-rect"/>
    <text x="420.0" y="581.5" class="act-txt">5. Bấm tiến hành</text>
<text x="420.0" y="598.5" class="act-txt">kiểm tra đơn hàng</text>

    
    <line x1="420" y1="607" x2="420" y2="630" class="line" marker-end="url(#arrow)"/>

    <!-- Bước 6: Nhập thông tin nhận hàng -->
    
    <rect x="320" y="630" width="200" height="42" class="action-rect"/>
    <text x="420.0" y="646.5" class="act-txt">6. Nhập thông tin nhận hàng &amp;</text>
<text x="420.0" y="663.5" class="act-txt">chọn hình thức thanh toán</text>

    
    <line x1="520" y1="651" x2="566" y2="651" class="line" marker-end="url(#arrow)"/>

    <!-- Bước 7: Backend tạo đơn hàng & khóa tồn kho -->
    
    <rect x="566" y="630" width="200" height="42" class="action-rect"/>
    <text x="666.0" y="646.5" class="act-txt">7. Backend tạo đơn hàng &amp;</text>
<text x="666.0" y="663.5" class="act-txt">khóa tồn kho 15 phút</text>

    
    <line x1="666" y1="672" x2="666" y2="695" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 2: Phương thức thanh toán? -->
    
    <polygon points="666,695 736,723 666,751 596,723" class="decision-diamond"/>
    <text x="666" y="719.5" class="dec-txt">Phương thức</text>
<text x="666" y="734.5" class="dec-txt">thanh toán?</text>

    

    <!-- Nhánh COD (Trái) sang Action COD -->
    <line x1="596" y1="723" x2="420" y2="723" class="line"/>
    <line x1="420" y1="723" x2="420" y2="765" class="line" marker-end="url(#arrow)"/>
    
    <rect x="492.75" y="704" width="34.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="510" y="716" class="guard-txt">[COD]</text>
    

    
    <rect x="320" y="765" width="200" height="42" class="action-rect"/>
    <text x="420.0" y="781.5" class="act-txt">Xác nhận đặt hàng COD</text>
<text x="420.0" y="798.5" class="act-txt">(Trạng thái: CONFIRMED)</text>

    

    <!-- Nhánh VietQR (Dưới) sang Quét mã VietQR -->
    <line x1="666" y1="751" x2="666" y2="775" class="line" marker-end="url(#arrow)"/>
    
    <rect x="676.5" y="754" width="57.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="705" y="766" class="guard-txt">[VietQR]</text>
    

    
    <rect x="566" y="775" width="200" height="42" class="action-rect"/>
    <text x="666.0" y="791.5" class="act-txt">Khách quét mã VietQR và</text>
<text x="666.0" y="808.5" class="act-txt">chờ SePay webhook</text>

    
    <line x1="666" y1="817" x2="666" y2="840" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 3: Trạng thái chuyển khoản? -->
    
    <polygon points="666,840 736,868 666,896 596,868" class="decision-diamond"/>
    <text x="666" y="864.5" class="dec-txt">Trạng thái</text>
<text x="666" y="879.5" class="dec-txt">chuyển khoản?</text>

    

    <!-- VietQR [Đủ tiền] (Dưới) cắm thẳng vào đỉnh Action Chuẩn bị giao hàng -->
    <line x1="666" y1="896" x2="666" y2="920" class="line" marker-end="url(#arrow)"/>
    
    <rect x="672.75" y="899" width="64.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="705" y="911" class="guard-txt">[Đủ tiền]</text>
    

    <!-- Action Chuẩn bị giao hàng (x=566, y=920, w=200, h=44) -> midpoint left=(566, 942) -->
    
    <rect x="566" y="920" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="937.5" class="act-txt">Xác nhận đã thanh toán và</text>
<text x="666.0" y="954.5" class="act-txt">chuẩn bị giao hàng</text>

    

    <!-- NHÁNH COD: TỪ ĐÁY COD (420, 807) ĐI XUỐNG y=942 VÀ CẮM CHÍNH XÁC VÀO CẠNH TRÁI TẠI (566, 942) -->
    <line x1="420" y1="807" x2="420" y2="942" class="line"/>
    <line x1="420" y1="942" x2="566" y2="942" class="line" marker-end="url(#arrow)"/>

    <!-- Sau chuẩn bị giao hàng -> Bàn giao thành công -->
    <line x1="666" y1="964" x2="666" y2="988" class="line" marker-end="url(#arrow)"/>
    
    <rect x="566" y="988" width="200" height="36" class="action-rect"/>
    <text x="666.0" y="1001.5" class="act-txt">Bàn giao và giao hàng</text>
<text x="666.0" y="1018.5" class="act-txt">thành công cho khách</text>

    
    <line x1="666" y1="1024" x2="666" y2="1038" class="line" marker-end="url(#arrow)"/>
    <circle cx="666" cy="1046" r="8" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="666" cy="1046" r="5" fill="#000000"/>

    <!-- Nhánh Hết 15p (Phải) -> Cắm chính xác vào Final Node hủy đơn -->
    <line x1="736" y1="868" x2="775" y2="868" class="line"/>
    <line x1="775" y1="868" x2="775" y2="985" class="line" marker-end="url(#arrow)"/>
    
    <rect x="732.75" y="849" width="64.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="765" y="861" class="guard-txt">[Hết 15p]</text>
    

    <circle cx="775" cy="995" r="8" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="775" cy="995" r="5" fill="#000000"/>
    <text x="775" y="1015" class="guard-txt">[Hủy / hoàn kho]</text>
    

  <line x1="50" y1="1055" x2="790" y2="1055" class="line"/>
  <rect x="50" y="1062" width="740" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="65" y="1079" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#000000">Ký hiệu chuẩn UML 2.x Activity Diagram:</text>
  
  <circle cx="80" cy="1103" r="8" fill="#000000"/>
  <text x="96" y="1107" class="leg-lbl">Nút bắt đầu (Initial)</text>

  <circle cx="80" cy="1127" r="9" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="1127" r="5" fill="#000000"/>
  <text x="96" y="1131" class="leg-lbl">Nút kết thúc (Final)</text>

  <rect x="250" y="1095" width="28" height="16" class="action-rect"/>
  <text x="286" y="1107" class="leg-lbl">Hành động (Action)</text>

  <polygon points="264,1120 274,1127 264,1134 254,1127" class="decision-diamond"/>
  <text x="286" y="1131" class="leg-lbl">Điểm quyết định (Chữ đặt bên trong)</text>

  <rect x="490" y="1102" width="30" height="5" class="sync-bar"/>
  <text x="528" y="1107" class="leg-lbl">Thanh phân nhánh / kết hợp (Fork/Join)</text>

  <line x1="490" y1="1127" x2="520" y2="1127" class="line" marker-end="url(#arrow)"/>
  <text x="528" y="1131" class="leg-lbl">Luồng điều khiển (Control Flow)</text>
</svg>