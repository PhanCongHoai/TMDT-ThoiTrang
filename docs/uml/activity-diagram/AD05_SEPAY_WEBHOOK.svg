<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 19px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 12.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .act-txt { font-family: 'Times New Roman', serif; font-size: 12.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .dec-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .guard-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .leg-lbl { font-family: 'Times New Roman', serif; font-size: 11px; fill: #000000; }
      .line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .action-rect { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; rx: 10px; ry: 10px; }
      .decision-diamond { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; }
      .sync-bar { fill: #000000; stroke: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Trang A4 nền trắng -->
  <rect x="0" y="0" width="840" height="1188" fill="#FFFFFF"/>
  <rect x="25" y="25" width="790" height="1138" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Tiêu đề trang -->
  <text x="420.0" y="62" class="title">PHÂN HỆ XỬ LÝ SEPAY WEBHOOK THỜI GIAN THỰC</text>
  <text x="420.0" y="85" class="subtitle">Đặc Tả Quy Trình Hoạt Động (UML 2.x Activity Diagram) | Mã Sơ Đồ: AD05_SEPAY_WEBHOOK | Trang 6 / 7</text>
  <line x1="50" y1="98" x2="790" y2="98" class="line"/>

  <!-- Khung bao Swimlane -->
  <rect x="50" y="115" width="740" height="925" fill="none" stroke="#000000" stroke-width="1.8"/>
  
        <rect x="50.0" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="173.33333333333331" y="136" font-family="'Times New Roman', serif" font-size="13.5px" font-weight="bold" fill="#000000" text-anchor="middle">Cổng SePay Gateway</text>
        <line x1="50.0" y1="147" x2="50.0" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        
        <rect x="296.66666666666663" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="419.99999999999994" y="136" font-family="'Times New Roman', serif" font-size="13.5px" font-weight="bold" fill="#000000" text-anchor="middle">Backend (Webhook Route)</text>
        <line x1="296.66666666666663" y1="147" x2="296.66666666666663" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        
        <rect x="543.3333333333333" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="666.6666666666666" y="136" font-family="'Times New Roman', serif" font-size="13.5px" font-weight="bold" fill="#000000" text-anchor="middle">Cơ Sở Dữ Liệu SQL Server</text>
        <line x1="543.3333333333333" y1="147" x2="543.3333333333333" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line x1="790" y1="147" x2="790" y2="1040" stroke="#000000" stroke-width="1.2"/>

  <!-- Nội dung -->
  
    <circle cx="173" cy="170" r="9" fill="#000000"/>
    <line x1="173" y1="179" x2="173" y2="205" class="line" marker-end="url(#arrow)"/>

    
    <rect x="73" y="205" width="200" height="44" class="action-rect"/>
    <text x="173.0" y="222.5" class="act-txt">SePay Gửi Yêu Cầu Webhook:</text>
<text x="173.0" y="239.5" class="act-txt">POST /api/v1/sepay/webhook</text>

    
    <line x1="273" y1="227" x2="320" y2="227" class="line" marker-end="url(#arrow)"/>

    
    <rect x="320" y="205" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="222.5" class="act-txt">Kiểm Tra Chữ Ký Xác Thực</text>
<text x="420.0" y="239.5" class="act-txt">API Key Trong Request Header</text>

    
    <line x1="420" y1="249" x2="420" y2="275" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 1: Chữ NẰM TRỌN TRONG HÌNH THOI -->
    
    <polygon points="420,275 488,305 420,335 352,305" class="decision-diamond"/>
    <text x="420" y="301.5" class="dec-txt">Xác Thực</text>
<text x="420" y="316.5" class="dec-txt">Token Hợp Lệ?</text>

    

    <!-- Không hợp lệ (Trái) -->
    <line x1="352" y1="305" x2="173" y2="305" class="line"/>
    <line x1="173" y1="305" x2="173" y2="345" class="line" marker-end="url(#arrow)"/>
    
    <rect x="225.25" y="286" width="79.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="265" y="298" class="guard-txt">[Sai Token]</text>
    

    
    <rect x="73" y="345" width="200" height="44" class="action-rect"/>
    <text x="173.0" y="362.5" class="act-txt">Từ Chối Yêu Cầu &amp;</text>
<text x="173.0" y="379.5" class="act-txt">Trả Mã Lỗi 401 Unauthorized</text>

    
    <line x1="173" y1="389" x2="173" y2="425" class="line" marker-end="url(#arrow)"/>
    <circle cx="173" cy="435" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="173" cy="435" r="6" fill="#000000"/>

    <!-- Hợp lệ (Dưới) -->
    <line x1="420" y1="335" x2="420" y2="375" class="line" marker-end="url(#arrow)"/>
    
    <rect x="431.5" y="346" width="57.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="460" y="358" class="guard-txt">[Hợp lệ]</text>
    

    
    <rect x="320" y="375" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="392.5" class="act-txt">Kiểm Tra Mã Giao Dịch Trùng Lặp</text>
<text x="420.0" y="409.5" class="act-txt">(Idempotency Trong payments)</text>

    
    <line x1="520" y1="397" x2="566" y2="397" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="375" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="392.5" class="act-txt">Truy Vấn Mã Đơn Hàng Theo Cú</text>
<text x="666.0" y="409.5" class="act-txt">Pháp Nội Dung Chuyển Khoản</text>

    
    <line x1="666" y1="419" x2="666" y2="445" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 2: Chữ NẰM TRỌN TRONG HÌNH THOI -->
    
    <polygon points="666,445 738,475 666,505 594,475" class="decision-diamond"/>
    <text x="666" y="471.5" class="dec-txt">So Khớp</text>
<text x="666" y="486.5" class="dec-txt">Số Tiền Chuyển?</text>

    

    <!-- Đủ/Thừa tiền (Dưới) -->
    <line x1="666" y1="505" x2="666" y2="545" class="line" marker-end="url(#arrow)"/>
    
    <rect x="682.75" y="516" width="64.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="715" y="528" class="guard-txt">[Đủ/Thừa]</text>
    

    
    <rect x="566" y="545" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="562.5" class="act-txt">Ghi Bảng payments &amp; Cập Nhật</text>
<text x="666.0" y="579.5" class="act-txt">orders: payment_status = PAID</text>

    
    <line x1="666" y1="589" x2="666" y2="625" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="625" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="642.5" class="act-txt">Chuyển Trạng Thái Đơn Hàng</text>
<text x="666.0" y="659.5" class="act-txt">status = CONFIRMED</text>

    
    <line x1="666" y1="669" x2="666" y2="705" class="line" marker-end="url(#arrow)"/>

    <!-- Thiếu tiền (Trái) -->
    <line x1="594" y1="475" x2="420" y2="475" class="line"/>
    <line x1="420" y1="475" x2="420" y2="545" class="line" marker-end="url(#arrow)"/>
    
    <rect x="466.5" y="456" width="87.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="510" y="468" class="guard-txt">[Thiếu tiền]</text>
    

    
    <rect x="320" y="545" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="562.5" class="act-txt">Cập Nhật PARTIALLY_PAID,</text>
<text x="420.0" y="579.5" class="act-txt">Giữ PENDING &amp; Ghi Thiếu</text>

    
    <line x1="420" y1="589" x2="420" y2="705" class="line"/>
    <line x1="420" y1="705" x2="566" y2="705" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="705" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="722.5" class="act-txt">Gửi Phản Hồi 200 OK Cho SePay</text>
<text x="666.0" y="739.5" class="act-txt">&amp; Gửi Thông Báo Cho Khách Hàng</text>

    
    <line x1="666" y1="749" x2="666" y2="790" class="line" marker-end="url(#arrow)"/>

    <circle cx="666" cy="800" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="666" cy="800" r="6" fill="#000000"/>
    

  <!-- Footer Chú Thích -->
  <line x1="50" y1="1055" x2="790" y2="1055" class="line"/>
  <rect x="50" y="1062" width="740" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="65" y="1079" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#000000">KÝ HIỆU CHUẨN UML 2.x ACTIVITY DIAGRAM:</text>
  
  <circle cx="80" cy="1103" r="8" fill="#000000"/>
  <text x="96" y="1107" class="leg-lbl">Nút bắt đầu (Initial)</text>

  <circle cx="80" cy="1127" r="9" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="1127" r="5" fill="#000000"/>
  <text x="96" y="1131" class="leg-lbl">Nút kết thúc (Final)</text>

  <rect x="250" y="1095" width="28" height="16" class="action-rect"/>
  <text x="286" y="1107" class="leg-lbl">Hành động (Action)</text>

  <polygon points="264,1120 274,1127 264,1134 254,1127" class="decision-diamond"/>
  <text x="286" y="1131" class="leg-lbl">Điểm quyết định (Chữ đặt bên trong)</text>

  <rect x="490" y="1102" width="30" height="5" class="sync-bar"/>
  <text x="528" y="1107" class="leg-lbl">Thanh phân nhánh / Kết hợp (Fork/Join)</text>

  <line x1="490" y1="1127" x2="520" y2="1127" class="line" marker-end="url(#arrow)"/>
  <text x="528" y="1131" class="leg-lbl">Luồng điều khiển (Control Flow)</text>
</svg>