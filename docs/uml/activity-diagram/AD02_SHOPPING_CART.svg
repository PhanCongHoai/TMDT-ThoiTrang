<text x="173.0" y="694.5" class="act-txt">Mua Sắm Trang Phục'</text>

    
    <line x1="173" y1="704" x2="173" y2="740" class="line" marker-end="url(#arrow)"/>
    <circle cx="173" cy="750" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="173" cy="750" r="6" fill="#000000"/>

    <!-- Giỏ còn hàng (Dưới) -->
    <line x1="420" y1="650" x2="420" y2="690" class="line" marker-end="url(#arrow)"/>
    
    <rect x="424.0" y="661" width="72.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="460" y="673" class="guard-txt">[Còn hàng]</text>
    

    
    <rect x="320" y="690" width="200" height="44" class="action-rect"/>
