    <line x1="420" y1="445" x2="420" y2="475" class="line" marker-end="url(#arrow)"/>
    
    <rect x="480.25" y="426" width="49.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
