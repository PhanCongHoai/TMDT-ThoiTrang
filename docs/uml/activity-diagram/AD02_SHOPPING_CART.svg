<text x="420.0" y="724.5" class="act-txt">Kiểm Tra Đơn Hàng'</text>

    
    <line x1="420" y1="734" x2="420" y2="780" class="line" marker-end="url(#arrow)"/>

    
    <rect x="320" y="780" width="200" height="44" class="action-rect"/>
