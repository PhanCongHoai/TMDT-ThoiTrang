    <line x1="666" y1="540" x2="520" y2="540" class="line" marker-end="url(#arrow)"/>
    
    <rect x="686.5" y="491" width="27.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="700" y="503" class="guard-txt">[Đủ]</text>
    

    
    <rect x="320" y="520" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="537.5" class="act-txt">Tính Toán Lại Tổng Tiền Giỏ</text>
<text x="420.0" y="554.5" class="act-txt">&amp; Cập Nhật localStorage</text>

    
    <line x1="420" y1="564" x2="420" y2="590" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 3: Chữ NẰM TRỌN TRONG HÌNH THOI -->
    
    <polygon points="420,590 488,620 420,650 352,620" class="decision-diamond"/>
    <text x="420" y="616.5" class="dec-txt">Giỏ Hàng</text>
<text x="420" y="631.5" class="dec-txt">Còn Sản Phẩm?</text>

    

    <!-- Giỏ rỗng (Trái) -->
    <line x1="352" y1="620" x2="173" y2="620" class="line"/>
    <line x1="173" y1="620" x2="173" y2="660" class="line" marker-end="url(#arrow)"/>
    
    <rect x="244.0" y="601" width="42.0" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="265" y="613" class="guard-txt">[Rỗng]</text>
    

    
    <rect x="73" y="660" width="200" height="44" class="action-rect"/>
