<text x="173.0" y="379.5" class="act-txt">Sản Phẩm Trong Giỏ</text>

    
    <line x1="273" y1="367" x2="566" y2="367" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="345" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="362.5" class="act-txt">Kiểm Tra Tồn Kho Biến Thể</text>
<text x="666.0" y="379.5" class="act-txt">Trong Bảng product_variants</text>

    
    <line x1="666" y1="389" x2="666" y2="415" class="line" marker-end="url(#arrow)"/>

