<text x="420.0" y="499.5" class="act-txt">Giữ Lại Số Lượng Tối Đa</text>

    

    <!-- Đủ tồn kho -->
    <line x1="666" y1="455" x2="666" y2="530" class="line"/>
    <line x1="666" y1="530" x2="520" y2="530" class="line" marker-end="url(#arrow)"/>
    
    <rect x="690.5" y="470" width="29.0" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
    <text x="705" y="483" class="guard-txt">[Đủ]</text>
    

    
    <rect x="320" y="510" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="527.5" class="act-txt">Tính Toán Lại Tổng Tiền Giỏ</text>
<text x="420.0" y="544.5" class="act-txt">&amp; Cập Nhật localStorage</text>

    
    <line x1="420" y1="554" x2="420" y2="590" class="line" marker-end="url(#arrow)"/>

    
    <polygon points="420,590 450,610 420,630 390,610" class="decision-diamond"/>
    
    
    
    <rect x="434.25" y="600" width="141.5" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
    <text x="505" y="613" class="guard-txt">[Giỏ còn sản phẩm?]</text>
    

    <!-- Giỏ rỗng -->
    <line x1="390" y1="610" x2="173" y2="610" class="line"/>
    <line x1="173" y1="610" x2="173" y2="650" class="line" marker-end="url(#arrow)"/>
    
    <rect x="248.0" y="592" width="44.0" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
    <text x="270" y="605" class="guard-txt">[Rỗng]</text>
    
    
    <rect x="73" y="650" width="200" height="44" class="action-rect"/>
    <text x="173.0" y="667.5" class="act-txt">Hiển Thị Nút 'Tiếp Tục</text>
<text x="173.0" y="684.5" class="act-txt">Mua Sắm Trang Phục'</text>

    
    <line x1="173" y1="694" x2="173" y2="730" class="line" marker-end="url(#arrow)"/>
    <circle cx="173" cy="740" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="173" cy="740" r="6" fill="#000000"/>

    <!-- Giỏ có hàng -> Bấm Tiến Hành Kiểm Tra Đơn Hàng -->
    <line x1="420" y1="630" x2="420" y2="680" class="line" marker-end="url(#arrow)"/>
    
    <rect x="423.0" y="645" width="74.0" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
    <text x="460" y="658" class="guard-txt">[Còn hàng]</text>
    

    
    <rect x="320" y="680" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="697.5" class="act-txt">Khách Nhấp 'Tiến Hành</text>
<text x="420.0" y="714.5" class="act-txt">Kiểm Tra Đơn Hàng'</text>

    
    <line x1="420" y1="724" x2="420" y2="770" class="line" marker-end="url(#arrow)"/>

    
    <rect x="320" y="770" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="787.5" class="act-txt">Điều Hướng Sang Giao Diện</text>
<text x="420.0" y="804.5" class="act-txt">Kiểm Tra Đơn Hàng (AD03)</text>

    
    <line x1="420" y1="814" x2="420" y2="855" class="line" marker-end="url(#arrow)"/>

    <circle cx="420" cy="865" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="420" cy="865" r="6" fill="#000000"/>
    

  <!-- Footer Chú Thích Chuẩn UML 2.x -->
  <line x1="50" y1="1055" x2="790" y2="1055" class="line"/>
  <rect x="50" y="1062" width="740" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="65" y="1079" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#000000">KÝ HIỆU CHUẨN UML 2.x ACTIVITY DIAGRAM:</text>
  
  <circle cx="80" cy="1103" r="8" fill="#000000"/>
  <text x="96" y="1107" class="leg-lbl">Nút bắt đầu (Initial)</text>

  <circle cx="80" cy="1127" r="9" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="1127" r="5" fill="#000000"/>
  <text x="96" y="1131" class="leg-lbl">Nút kết thúc (Final)</text>

  <rect x="250" y="1095" width="28" height="16" class="action-rect"/>
  <text x="286" y="1107" class="leg-lbl">Hành động (Action)</text>

  <polygon points="264,1120 274,1127 264,1134 254,1127" class="decision-diamond"/>
  <text x="286" y="1131" class="leg-lbl">Điểm quyết định / Hợp nhất</text>

  <rect x="460" y="1102" width="30" height="5" class="sync-bar"/>
  <text x="498" y="1107" class="leg-lbl">Thanh phân nhánh / Kết hợp (Fork/Join)</text>

  <line x1="460" y1="1127" x2="490" y2="1127" class="line" marker-end="url(#arrow)"/>
  <text x="498" y="1131" class="leg-lbl">Luồng điều khiển (Control Flow)</text>

  <text x="690" y="1119" class="leg-lbl" font-weight="bold">[Điều kiện rẽ nhánh]</text>
</svg>