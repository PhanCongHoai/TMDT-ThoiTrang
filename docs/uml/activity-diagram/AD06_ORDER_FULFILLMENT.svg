<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 19px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 12.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .act-txt { font-family: 'Times New Roman', serif; font-size: 12.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .dec-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .guard-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .leg-lbl { font-family: 'Times New Roman', serif; font-size: 11px; fill: #000000; }
      .line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .action-rect { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; rx: 10px; ry: 10px; }
      .decision-diamond { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; }
      .sync-bar { fill: #000000; stroke: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Trang A4 nền trắng -->
  <rect x="0" y="0" width="840" height="1188" fill="#FFFFFF"/>
  <rect x="25" y="25" width="790" height="1138" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Tiêu đề trang -->
  <text x="420.0" y="62" class="title">PHÂN HỆ XỬ LÝ ĐƠN HÀNG &amp; GIAO HÀNG TẬN NƠI</text>
  <text x="420.0" y="85" class="subtitle">Đặc Tả Quy Trình Hoạt Động (UML 2.x Activity Diagram) | Mã Sơ Đồ: AD06_ORDER_FULFILLMENT | Trang 7 / 7</text>
  <line x1="50" y1="98" x2="790" y2="98" class="line"/>

  <!-- Khung bao Swimlane -->
  <rect x="50" y="115" width="740" height="925" fill="none" stroke="#000000" stroke-width="1.8"/>
  
        <rect x="50.0" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="173.33333333333331" y="136" font-family="'Times New Roman', serif" font-size="13.5px" font-weight="bold" fill="#000000" text-anchor="middle">Khách Hàng (Customer)</text>
        <line x1="50.0" y1="147" x2="50.0" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        
        <rect x="296.66666666666663" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="419.99999999999994" y="136" font-family="'Times New Roman', serif" font-size="13.5px" font-weight="bold" fill="#000000" text-anchor="middle">Bộ Phận Vận Hành &amp; Thợ May</text>
        <line x1="296.66666666666663" y1="147" x2="296.66666666666663" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        
        <rect x="543.3333333333333" y="115" width="246.66666666666666" height="32" fill="#F4F4F4" stroke="#000000" stroke-width="1.5"/>
        <text x="666.6666666666666" y="136" font-family="'Times New Roman', serif" font-size="13.5px" font-weight="bold" fill="#000000" text-anchor="middle">Hệ Thống &amp; Nhân Viên Giao Hàng</text>
        <line x1="543.3333333333333" y1="147" x2="543.3333333333333" y2="1040" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line x1="790" y1="147" x2="790" y2="1040" stroke="#000000" stroke-width="1.2"/>

  <!-- Nội dung -->
  
    <circle cx="420" cy="170" r="9" fill="#000000"/>
    <line x1="420" y1="179" x2="420" y2="205" class="line" marker-end="url(#arrow)"/>

    
    <rect x="320" y="205" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="222.5" class="act-txt">Tiếp Nhận Đơn Hàng Đã Xác</text>
<text x="420.0" y="239.5" class="act-txt">Nhận (status = CONFIRMED)</text>

    
    <line x1="420" y1="249" x2="420" y2="280" class="line" marker-end="url(#arrow)"/>

    
    <rect x="320" y="280" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="297.5" class="act-txt">Kiểm Tra Kỹ Thuật May Đo &amp;</text>
<text x="420.0" y="314.5" class="act-txt">Đóng Gói Hộp Quà Cao Cấp</text>

    
    <line x1="420" y1="324" x2="420" y2="355" class="line" marker-end="url(#arrow)"/>

    
    <rect x="320" y="355" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="372.5" class="act-txt">Cập Nhật Trạng Thái Đơn Hàng</text>
<text x="420.0" y="389.5" class="act-txt">status = PROCESSING</text>

    
    <line x1="520" y1="377" x2="566" y2="377" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="355" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="372.5" class="act-txt">Bàn Giao Cho Nhân Viên Giao</text>
<text x="666.0" y="389.5" class="act-txt">Hàng &amp; Sinh Mã GHN-VN-xxxxxxxx</text>

    
    <line x1="666" y1="399" x2="666" y2="430" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="430" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="447.5" class="act-txt">Cập Nhật Trạng Thái Giao Vận</text>
<text x="666.0" y="464.5" class="act-txt">status = SHIPPED</text>

    
    <line x1="566" y1="452" x2="273" y2="452" class="line" marker-end="url(#arrow)"/>

    
    <rect x="73" y="430" width="200" height="44" class="action-rect"/>
    <text x="173.0" y="447.5" class="act-txt">Nhân Viên Giao Tận Nhà &amp;</text>
<text x="173.0" y="464.5" class="act-txt">Khách Hàng Thử Đồ May Đo</text>

    
    <line x1="173" y1="474" x2="173" y2="510" class="line" marker-end="url(#arrow)"/>

    <!-- Decision 1: Chữ NẰM TRỌN TRONG HÌNH THOI -->
    
    <polygon points="173,510 243,540 173,570 103,540" class="decision-diamond"/>
    <text x="173" y="536.5" class="dec-txt">Khách Hàng</text>
<text x="173" y="551.5" class="dec-txt">Đồng Ý Nhận?</text>

    

    <!-- Nhận hàng thành công (Dưới) -->
    <line x1="173" y1="570" x2="173" y2="615" class="line" marker-end="url(#arrow)"/>
    
    <rect x="175.25" y="583" width="79.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="215" y="595" class="guard-txt">[Nhận hàng]</text>
    

    
    <rect x="73" y="615" width="200" height="44" class="action-rect"/>
    <text x="173.0" y="632.5" class="act-txt">Nếu Đơn COD: Thu Tiền Mặt &amp;</text>
<text x="173.0" y="649.5" class="act-txt">Cập Nhật payment_status = PAID</text>

    
    <line x1="173" y1="659" x2="173" y2="695" class="line"/>
    <line x1="173" y1="695" x2="566" y2="695" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="675" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="692.5" class="act-txt">Cập Nhật status = COMPLETED &amp;</text>
<text x="666.0" y="709.5" class="act-txt">Kích Hoạt Bảo Hành Điện Tử 12T</text>

    
    <line x1="666" y1="719" x2="666" y2="765" class="line" marker-end="url(#arrow)"/>
    <circle cx="666" cy="775" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="666" cy="775" r="6" fill="#000000"/>

    <!-- Khách từ chối nhận hàng (Phải) -->
    <line x1="243" y1="540" x2="420" y2="540" class="line"/>
    <line x1="420" y1="540" x2="420" y2="615" class="line" marker-end="url(#arrow)"/>
    
    <rect x="277.75" y="521" width="64.5" height="17" fill="#FFFFFF" stroke="#000000" stroke-width="0.7"/>
    <text x="310" y="533" class="guard-txt">[Từ chối]</text>
    

    
    <rect x="320" y="615" width="200" height="44" class="action-rect"/>
    <text x="420.0" y="632.5" class="act-txt">Cập Nhật status = CANCELLED</text>
<text x="420.0" y="649.5" class="act-txt">&amp; Mang Hàng Về Hoàn Kho</text>

    
    <line x1="420" y1="659" x2="420" y2="755" class="line"/>
    <line x1="420" y1="755" x2="566" y2="755" class="line" marker-end="url(#arrow)"/>

    
    <rect x="566" y="735" width="200" height="44" class="action-rect"/>
    <text x="666.0" y="752.5" class="act-txt">Cộng Lại Tồn Kho Trong CSDL &amp;</text>
<text x="666.0" y="769.5" class="act-txt">Ghi Nhận Đơn Hàng Thất Bại</text>

    
    <line x1="666" y1="779" x2="666" y2="825" class="line" marker-end="url(#arrow)"/>
    <circle cx="666" cy="835" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="666" cy="835" r="6" fill="#000000"/>
    

  <!-- Footer Chú Thích -->
  <line x1="50" y1="1055" x2="790" y2="1055" class="line"/>
  <rect x="50" y="1062" width="740" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="65" y="1079" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#000000">KÝ HIỆU CHUẨN UML 2.x ACTIVITY DIAGRAM:</text>
  
  <circle cx="80" cy="1103" r="8" fill="#000000"/>
  <text x="96" y="1107" class="leg-lbl">Nút bắt đầu (Initial)</text>

  <circle cx="80" cy="1127" r="9" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="80" cy="1127" r="5" fill="#000000"/>
  <text x="96" y="1131" class="leg-lbl">Nút kết thúc (Final)</text>

  <rect x="250" y="1095" width="28" height="16" class="action-rect"/>
  <text x="286" y="1107" class="leg-lbl">Hành động (Action)</text>

  <polygon points="264,1120 274,1127 264,1134 254,1127" class="decision-diamond"/>
  <text x="286" y="1131" class="leg-lbl">Điểm quyết định (Chữ đặt bên trong)</text>

  <rect x="490" y="1102" width="30" height="5" class="sync-bar"/>
  <text x="528" y="1107" class="leg-lbl">Thanh phân nhánh / Kết hợp (Fork/Join)</text>

  <line x1="490" y1="1127" x2="520" y2="1127" class="line" marker-end="url(#arrow)"/>
  <text x="528" y="1131" class="leg-lbl">Luồng điều khiển (Control Flow)</text>
</svg>