<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1188" xmlns="http://www.w3.org/2000/svg" width="840" height="1188">
  
  <defs>
    <!-- Open Arrow for <<include>> and <<extend>> -->
    <marker id="open-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.8" />
    </marker>
    <!-- Solid Arrow for Associations if needed -->
    <marker id="solid-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,2 8,5 0,8" fill="#000000" />
    </marker>
    <!-- Hollow Triangle for Generalization -->
    <marker id="gen-arr" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto">
      <polygon points="1,2 12,7 1,12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    </marker>
  </defs>

  <rect width="840" height="1188" fill="#FFFFFF" />

  
  <!-- PAGE HEADER -->
  <rect x="30" y="24" width="780" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="420" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">AURALIÈ — UML USE CASE DIAGRAM (A4 DỌC)</text>
  <text x="420" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000000" text-anchor="middle">PHÂN HỆ 3: TÀI KHOẢN, YÊU THÍCH &amp; TƯƠNG TÁC (AUTH &amp; ENGAGEMENT)</text>
  <rect x="730" y="36" width="65" height="24" fill="#000000" />
  <text x="762" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRANG 3/4</text>
    

  <!-- ACTORS (LEFT) -->
  
  <!-- ACTOR: Khách Hàng -->
  <g class="actor">
    <!-- Head -->
    <circle cx="120" cy="260" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <!-- Body -->
    <line x1="120" y1="275" x2="120" y2="312" stroke="#000000" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="92" y1="290" x2="148" y2="290" stroke="#000000" stroke-width="2.2" />
    <!-- Left Leg -->
    <line x1="120" y1="312" x2="100" y2="348" stroke="#000000" stroke-width="2.2" />
    <!-- Right Leg -->
    <line x1="120" y1="312" x2="140" y2="348" stroke="#000000" stroke-width="2.2" />
    <!-- Label -->
    <text x="120" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#000000" text-anchor="middle">Khách Hàng</text>
    <text x="120" y="387" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000" text-anchor="middle">(Guest / Vãng Lai)</text>
  </g>
    

  <!-- GENERALIZATION ARROW: Customer inherits from Guest -->
  <line x1="120" y1="620" x2="120" y2="405" stroke="#000000" stroke-width="2" marker-end="url(#gen-arr)" />
  <text x="135" y="510" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#000000">Kế thừa</text>

  
  <!-- ACTOR: Khách Đã Đăng Nhập -->
  <g class="actor">
    <!-- Head -->
    <circle cx="120" cy="630" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <!-- Body -->
    <line x1="120" y1="645" x2="120" y2="682" stroke="#000000" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="92" y1="660" x2="148" y2="660" stroke="#000000" stroke-width="2.2" />
    <!-- Left Leg -->
    <line x1="120" y1="682" x2="100" y2="718" stroke="#000000" stroke-width="2.2" />
    <!-- Right Leg -->
    <line x1="120" y1="682" x2="140" y2="718" stroke="#000000" stroke-width="2.2" />
    <!-- Label -->
    <text x="120" y="740" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#000000" text-anchor="middle">Khách Đã Đăng Nhập</text>
    <text x="120" y="757" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000" text-anchor="middle">(Customer / VIP)</text>
  </g>
    

  <!-- SYSTEM BOUNDARY -->
  <rect x="235" y="105" width="575" height="990" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="235" y="105" width="575" height="34" fill="#000000" />
  <text x="250" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Phân Hệ: Tài Khoản &amp; Tương Tác Hội Viên</text>

  <!-- USE CASES -->
  
  <!-- USE CASE: UC17 -->
  <g class="usecase">
    <ellipse cx="480" cy="190" rx="155" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC17: Đăng Ký Tài Khoản</text>
    <text x="480" y="203" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Bcrypt salt=12 • JWT Auth</text>
  </g>
    
  
  <!-- USE CASE: UC18 -->
  <g class="usecase">
    <ellipse cx="480" cy="310" rx="155" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC18: Đăng Nhập Hệ Thống</text>
    <text x="480" y="323" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Xác thực email &amp; mật khẩu</text>
  </g>
    
  
  <!-- USE CASE: UC19 -->
  <g class="usecase">
    <ellipse cx="480" cy="430" rx="155" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC19: Quên &amp; Đặt Lại Mật Khẩu</text>
    <text x="480" y="443" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Token xác nhận email</text>
  </g>
    
  
  <!-- USE CASE: UC15 -->
  <g class="usecase">
    <ellipse cx="480" cy="560" rx="160" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC15: Gửi Liên Hệ / Tư Vấn May Đo</text>
    <text x="480" y="573" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Form Bespoke Atelier Đồng Khởi</text>
  </g>
    
  
  <!-- USE CASE: UC16 -->
  <g class="usecase">
    <ellipse cx="480" cy="690" rx="160" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC16: Đăng Ký Nhận Bản Tin VIP</text>
    <text x="480" y="703" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Đặc quyền ra mắt BST mới</text>
  </g>
    
  
  <!-- Customer Exclusive -->
  
  <!-- USE CASE: UC14 -->
  <g class="usecase">
    <ellipse cx="480" cy="830" rx="165" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="824" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC14: Quản Lý Danh Sách Yêu Thích</text>
    <text x="480" y="843" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Wishlist tim đỏ • Đồng bộ CSDL</text>
  </g>
    
  
  <!-- USE CASE: UC20 -->
  <g class="usecase">
    <ellipse cx="480" cy="960" rx="150" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="480" y="954" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC20: Đăng Xuất</text>
    <text x="480" y="973" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Xóa JWT token khỏi phiên</text>
  </g>
    

  <!-- ASSOCIATIONS (GUEST - SOLID LINES) -->
  <line x1="160" y1="260" x2="325" y2="190" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="270" x2="325" y2="310" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="280" x2="325" y2="430" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="290" x2="320" y2="560" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="300" x2="320" y2="690" stroke="#000000" stroke-width="1.8" />

  <!-- ASSOCIATIONS (CUSTOMER - SOLID LINES) -->
  <line x1="160" y1="640" x2="315" y2="830" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="650" x2="330" y2="960" stroke="#000000" stroke-width="1.8" />

  
  <!-- PAGE FOOTER (ISO 5807 / UML 2.X MONOCHROME) -->
  <rect x="30" y="1120" width="780" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="45" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">
    <tspan font-weight="bold">Quy ước UML 2.x:</tspan> Người = Actor | Ellipse = Use Case | Nét liền = Association | ┈▷ = Generalization | ┈&gt; = Include / Extend
  </text>
  <text x="795" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="end">
    Sơ Đồ 3: Tài Khoản &amp; Tương Tác Hội Viên • A4 Portrait
  </text>
    
</svg>