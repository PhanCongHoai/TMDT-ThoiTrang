<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1188" xmlns="http://www.w3.org/2000/svg" width="840" height="1188">
  
  <defs>
    <!-- Open Arrow for <<include>> and <<extend>> -->
    <marker id="open-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.8" />
    </marker>
    <!-- Solid Arrow for Associations if needed -->
    <marker id="solid-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,2 8,5 0,8" fill="#000000" />
    </marker>
    <!-- Hollow Triangle for Generalization -->
    <marker id="gen-arr" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto">
      <polygon points="1,2 12,7 1,12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    </marker>
  </defs>

  <rect width="840" height="1188" fill="#FFFFFF" />

  
  <!-- PAGE HEADER -->
  <rect x="30" y="24" width="780" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="420" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">AURALIÈ — UML USE CASE DIAGRAM (A4 DỌC)</text>
  <text x="420" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000000" text-anchor="middle">PHÂN HỆ 2: GIỎ HÀNG, ĐẶT HÀNG &amp; THANH TOÁN (CART &amp; CHECKOUT)</text>
  <rect x="730" y="36" width="65" height="24" fill="#000000" />
  <text x="762" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRANG 2/4</text>
    

  <!-- ACTORS -->
  
  <!-- ACTOR: Khách Hàng -->
  <g class="actor">
    <!-- Head -->
    <circle cx="120" cy="360" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <!-- Body -->
    <line x1="120" y1="375" x2="120" y2="412" stroke="#000000" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="92" y1="390" x2="148" y2="390" stroke="#000000" stroke-width="2.2" />
    <!-- Left Leg -->
    <line x1="120" y1="412" x2="100" y2="448" stroke="#000000" stroke-width="2.2" />
    <!-- Right Leg -->
    <line x1="120" y1="412" x2="140" y2="448" stroke="#000000" stroke-width="2.2" />
    <!-- Label -->
    <text x="120" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#000000" text-anchor="middle">Khách Hàng</text>
    <text x="120" y="487" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000" text-anchor="middle">(Customer / VIP)</text>
  </g>
    
  
  <!-- ACTOR: Cổng SePay -->
  <g class="actor">
    <!-- Head -->
    <circle cx="740" cy="780" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <!-- Body -->
    <line x1="740" y1="795" x2="740" y2="832" stroke="#000000" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="712" y1="810" x2="768" y2="810" stroke="#000000" stroke-width="2.2" />
    <!-- Left Leg -->
    <line x1="740" y1="832" x2="720" y2="868" stroke="#000000" stroke-width="2.2" />
    <!-- Right Leg -->
    <line x1="740" y1="832" x2="760" y2="868" stroke="#000000" stroke-width="2.2" />
    <!-- Label -->
    <text x="740" y="890" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#000000" text-anchor="middle">Cổng SePay</text>
    <text x="740" y="907" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000" text-anchor="middle">«Secondary System»</text>
  </g>
    

  <!-- SYSTEM BOUNDARY -->
  <rect x="225" y="105" width="465" height="990" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="225" y="105" width="465" height="34" fill="#000000" />
  <text x="240" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Phân Hệ: Giỏ Hàng &amp; Đặt Hàng Thanh Toán</text>

  <!-- USE CASES -->
  
  <!-- USE CASE: UC08 -->
  <g class="usecase">
    <ellipse cx="455" cy="200" rx="155" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="455" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC08: Quản Lý Giỏ Hàng</text>
    <text x="455" y="213" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Thêm, chỉnh sửa số lượng, xóa</text>
  </g>
    
  
  <!-- USE CASE: UC09 -->
  <g class="usecase">
    <ellipse cx="455" cy="380" rx="165" ry="38" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="455" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC09: Đặt Hàng &amp; Thanh Toán</text>
    <text x="455" y="393" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">POST /api/v1/orders (Transaction)</text>
  </g>
    
  
  <!-- USE CASE: UC10 -->
  <g class="usecase">
    <ellipse cx="455" cy="570" rx="155" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="455" y="564" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC10: Xác Thực Thông Tin Giao</text>
    <text x="455" y="583" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Họ tên, SĐT, Địa chỉ, Hỏa tốc 2h</text>
  </g>
    

  <!-- EXTENSIONS OF UC09 -->
  
  <!-- USE CASE: UC11 -->
  <g class="usecase">
    <ellipse cx="340" cy="760" rx="105" ry="30" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="340" y="754" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC11: Áp Dụng Coupon</text>
    <text x="340" y="773" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Mã giảm giá</text>
  </g>
    
  
  <!-- USE CASE: UC12 -->
  <g class="usecase">
    <ellipse cx="560" cy="760" rx="115" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="560" y="754" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC12: Thanh Toán QR</text>
    <text x="560" y="773" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">VietQR SePay 24/7</text>
  </g>
    
  
  <!-- USE CASE: UC13 -->
  <g class="usecase">
    <ellipse cx="455" cy="930" rx="140" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="455" y="924" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC13: Thanh Toán COD</text>
    <text x="455" y="943" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Tiền mặt khi nhận</text>
  </g>
    

  <!-- RELATIONSHIPS -->
  <!-- Include UC09 -> UC10 -->
  <line x1="455" y1="418" x2="455" y2="536" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arr)" />
  <text x="470" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#000000">«include»</text>

  <!-- Extend UC11 -> UC09 -->
  <line x1="360" y1="730" x2="425" y2="418" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arr)" />
  <text x="375" y="580" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#000000" text-anchor="middle">«extend»</text>

  <!-- Extend UC12 -> UC09 -->
  <line x1="540" y1="728" x2="485" y2="418" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arr)" />
  <text x="535" y="580" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#000000" text-anchor="middle">«extend»</text>

  <!-- Extend UC13 -> UC09 -->
  <path d="M 315 930 L 250 930 L 250 380 L 290 380" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arr)" />
  <text x="240" y="650" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#000000" text-anchor="end">«extend»</text>

  <!-- ASSOCIATIONS (SOLID LINES) -->
  <line x1="160" y1="350" x2="300" y2="200" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="370" x2="290" y2="380" stroke="#000000" stroke-width="1.8" />

  <!-- External SePay Webhook -> UC12 -->
  <line x1="680" y1="780" x2="675" y2="760" stroke="#000000" stroke-width="1.8" marker-end="url(#open-arr)" />
  <text x="735" y="745" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#000000" text-anchor="middle">«Webhook»</text>

  
  <!-- PAGE FOOTER (ISO 5807 / UML 2.X MONOCHROME) -->
  <rect x="30" y="1120" width="780" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="45" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">
    <tspan font-weight="bold">Quy ước UML 2.x:</tspan> Người = Actor | Ellipse = Use Case | Nét liền = Association | ┈▷ = Generalization | ┈&gt; = Include / Extend
  </text>
  <text x="795" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="end">
    Sơ Đồ 2: Giỏ Hàng &amp; Đặt Hàng Thanh Toán • A4 Portrait
  </text>
    
</svg>