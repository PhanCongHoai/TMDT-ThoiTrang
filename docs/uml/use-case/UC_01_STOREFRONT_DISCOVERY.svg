<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1188" xmlns="http://www.w3.org/2000/svg" width="840" height="1188">
  
  <defs>
    <!-- Open Arrow for <<include>> and <<extend>> -->
    <marker id="open-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.8" />
    </marker>
    <!-- Solid Arrow for Associations if needed -->
    <marker id="solid-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,2 8,5 0,8" fill="#000000" />
    </marker>
    <!-- Hollow Triangle for Generalization -->
    <marker id="gen-arr" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto">
      <polygon points="1,2 12,7 1,12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- White Background -->
  <rect width="840" height="1188" fill="#FFFFFF" />

  
  <!-- PAGE HEADER -->
  <rect x="30" y="24" width="780" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="420" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">AURALIÈ — UML USE CASE DIAGRAM (A4 DỌC)</text>
  <text x="420" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000000" text-anchor="middle">PHÂN HỆ 1: KHÁM PHÁ &amp; DUYỆT SẢN PHẨM (CATALOG &amp; DISCOVERY)</text>
  <rect x="730" y="36" width="65" height="24" fill="#000000" />
  <text x="762" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRANG 1/4</text>
    

  <!-- MAIN ACTOR (LEFT) -->
  
  <!-- ACTOR: Khách Hàng -->
  <g class="actor">
    <!-- Head -->
    <circle cx="120" cy="480" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <!-- Body -->
    <line x1="120" y1="495" x2="120" y2="532" stroke="#000000" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="92" y1="510" x2="148" y2="510" stroke="#000000" stroke-width="2.2" />
    <!-- Left Leg -->
    <line x1="120" y1="532" x2="100" y2="568" stroke="#000000" stroke-width="2.2" />
    <!-- Right Leg -->
    <line x1="120" y1="532" x2="140" y2="568" stroke="#000000" stroke-width="2.2" />
    <!-- Label -->
    <text x="120" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#000000" text-anchor="middle">Khách Hàng</text>
    <text x="120" y="607" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000" text-anchor="middle">(Guest / Vãng Lai)</text>
  </g>
    

  <!-- SYSTEM BOUNDARY -->
  <rect x="235" y="105" width="575" height="990" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="235" y="105" width="575" height="34" fill="#000000" />
  <text x="250" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Phân Hệ: Khám Phá &amp; Duyệt Sản Phẩm</text>

  <!-- USE CASES -->
  
  <!-- USE CASE: UC01 -->
  <g class="usecase">
    <ellipse cx="430" cy="200" rx="150" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="430" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC01: Duyệt Danh Mục Sản Phẩm</text>
    <text x="430" y="213" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">GET /api/v1/products</text>
  </g>
    
  
  <!-- USE CASE: UC02 -->
  <g class="usecase">
    <ellipse cx="430" cy="340" rx="150" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="430" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC02: Tìm Kiếm &amp; Lọc Nâng Cao</text>
    <text x="430" y="353" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Từ khóa, Size, Màu sắc, Giá</text>
  </g>
    
  
  <!-- USE CASE: UC03 -->
  <g class="usecase">
    <ellipse cx="390" cy="500" rx="140" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="390" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC03: Xem Chi Tiết Sản Phẩm</text>
    <text x="390" y="513" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Modal QuickView &amp; Thuộc tính</text>
  </g>
    
  
  <!-- UC04: Bảng size (Extension of UC03) -->
  
  <!-- USE CASE: UC04 -->
  <g class="usecase">
    <ellipse cx="675" cy="500" rx="115" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="675" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC04: Bảng Size May Đo</text>
    <text x="675" y="513" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Size riêng từng loại hàng</text>
  </g>
    
  
  
  <!-- USE CASE: UC05 -->
  <g class="usecase">
    <ellipse cx="430" cy="660" rx="150" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="430" y="654" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC05: Xem Đánh Giá &amp; Số Sao</text>
    <text x="430" y="673" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">SQL Server Live Reviews</text>
  </g>
    
  
  <!-- USE CASE: UC06 -->
  <g class="usecase">
    <ellipse cx="430" cy="800" rx="150" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="430" y="794" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC06: Đọc Tạp Chí Thời Trang (Blog)</text>
    <text x="430" y="813" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Ấn phẩm Haute Couture Editorial</text>
  </g>
    
  
  <!-- USE CASE: UC07 -->
  <g class="usecase">
    <ellipse cx="430" cy="940" rx="150" ry="34" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <text x="430" y="934" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UC07: Trò Chuyện Với AI Stylist</text>
    <text x="430" y="953" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">POST /api/v1/ai/chat</text>
  </g>
    

  <!-- EXTEND: UC04 -> UC03 -->
  <line x1="560" y1="500" x2="530" y2="500" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arr)" />
  <text x="545" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#000000" text-anchor="middle">«extend»</text>

  <!-- ASSOCIATIONS (SOLID LINES) -->
  <line x1="160" y1="480" x2="280" y2="200" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="490" x2="280" y2="340" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="500" x2="250" y2="500" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="510" x2="280" y2="660" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="520" x2="280" y2="800" stroke="#000000" stroke-width="1.8" />
  <line x1="160" y1="530" x2="280" y2="940" stroke="#000000" stroke-width="1.8" />

  
  <!-- PAGE FOOTER (ISO 5807 / UML 2.X MONOCHROME) -->
  <rect x="30" y="1120" width="780" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="45" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">
    <tspan font-weight="bold">Quy ước UML 2.x:</tspan> Người = Actor | Ellipse = Use Case | Nét liền = Association | ┈▷ = Generalization | ┈&gt; = Include / Extend
  </text>
  <text x="795" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="end">
    Sơ Đồ 1: Khám Phá &amp; Duyệt Sản Phẩm • A4 Portrait
  </text>
    
</svg>