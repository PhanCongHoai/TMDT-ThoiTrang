<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 19.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 12.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .actor-lbl { font-family: 'Times New Roman', serif; font-size: 14.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .msg-txt { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .guard-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; }
      .frame-lbl { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .footer-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .line { stroke: #000000; stroke-width: 1.6; fill: none; }
      .lifeline { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 4,4; fill: none; }
      .activation { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; }
      .frame-box { fill: none; stroke: #000000; stroke-width: 1.3; }
      .divider { stroke: #000000; stroke-width: 1.1; stroke-dasharray: 4,4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Trang A4 Nền Trắng & Khung Viền -->
  <rect x="0" y="0" width="840" height="1188" fill="#FFFFFF"/>
  <rect x="25" y="25" width="790" height="1138" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Tiêu Đề -->
  <text x="420.0" y="58" class="title">SƠ ĐỒ TUẦN TỰ: KHÁCH HÀNG TRA CỨU VÀ HỦY ĐƠN HÀNG</text>
  <text x="420.0" y="80" class="subtitle">Đặc tả quy trình nghiệp vụ 06 | Chuẩn UML 2.x | Hệ thống AURALIÈ | Hình 6 / 8</text>
  <line x1="45" y1="94" x2="795" y2="94" class="line"/>

  <!-- LIFELINE HEADERS -->
  
            <circle cx="160" cy="112" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="122" x2="160" y2="142" stroke="#000000" stroke-width="1.8"/>
            <line x1="146" y1="130" x2="174" y2="130" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="142" x2="148" y2="158" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="142" x2="172" y2="158" stroke="#000000" stroke-width="1.8"/>
            <text x="160" y="176" class="actor-lbl">Khách hàng</text>
            
  
            <rect x="345" y="118" width="150" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <text x="420" y="143" class="actor-lbl">Hệ thống</text>
            
  
            <path d="M 620 122 A 60 12 0 0 0 740 122 L 740 148 A 60 12 0 0 1 620 148 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <ellipse cx="680" cy="122" rx="60" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <text x="680" y="145" class="actor-lbl">Cơ sở dữ liệu</text>
            

  <!-- LIFELINES (Vertical Dashed Lines) -->
  <line x1="160" y1="185" x2="160" y2="1080" class="lifeline"/>
  <line x1="420" y1="185" x2="420" y2="1080" class="lifeline"/>
  <line x1="680" y1="185" x2="680" y2="1080" class="lifeline"/>

  <!-- NỘI DUNG TƯƠNG TÁC NGHIỆP VỤ -->
  
    <rect x="154" y="210" width="12" height="740" class="activation"/>
    <rect x="414" y="210" width="12" height="740" class="activation"/>

    <line x1="166" y1="230" x2="414" y2="230" class="line" marker-end="url(#arrow)"/>
    <text x="175" y="224" class="msg-txt">[01] Gửi yêu cầu tra cứu đơn hàng: GET /api/v1/orders/track/:code</text>

    <rect x="674" y="240" width="12" height="110" class="activation"/>

    <line x1="426" y1="260" x2="674" y2="260" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="254" class="msg-txt">[02] Truy vấn dữ liệu: SELECT * FROM orders WHERE order_code = @code OR tracking_code = @code</text>

    <line x1="674" y1="300" x2="426" y2="300" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="294" class="msg-txt">[03] Trả kết quả: Trạng thái đơn, mã vận đơn GHN-VN và lịch sử giao hàng</text>

    <line x1="414" y1="330" x2="166" y2="330" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="324" class="msg-txt">[04] Phản hồi thành công: 200 OK (Hiển thị tiến trình lộ trình vận chuyển)</text>

    <!-- Khách hủy đơn -->
    <line x1="166" y1="410" x2="414" y2="410" class="line" marker-end="url(#arrow)"/>
    <text x="175" y="404" class="msg-txt">[05] Gửi yêu cầu hủy đơn hàng: POST /api/v1/orders/:id/cancel (Kèm JWT Token)</text>

    <rect x="674" y="420" width="12" height="380" class="activation"/>

    <line x1="426" y1="435" x2="674" y2="435" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="429" class="msg-txt">[06] Truy vấn dữ liệu: SELECT * FROM orders WHERE id = @id</text>

    <line x1="674" y1="470" x2="426" y2="470" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="464" class="msg-txt">[07] Trả kết quả: Thông tin đơn hàng và trạng thái hiện tại</text>

    <!-- Alt: Cancel Conditions -->
    <rect x="55" y="495" width="730" height="325" class="frame-box"/>
    <polygon points="55,495 115,495 115,510 95,510 95,495" fill="#F4F4F4" stroke="#000000" stroke-width="0.8"/>
    <text x="65" y="507" class="frame-lbl">alt</text>
    <text x="125" y="507" class="guard-txt">[Đơn hàng đã bàn giao vận chuyển (SHIPPED hoặc COMPLETED)]</text>

    <line x1="414" y1="540" x2="166" y2="540" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="534" class="msg-txt">[08] Phản hồi lỗi: 400 Bad Request ("Đơn hàng đang giao, không thể tự hủy")</text>

    <line x1="55" y1="565" x2="785" y2="565" class="divider"/>
    <text x="125" y="580" class="guard-txt">[Đơn hàng ở trạng thái PENDING hoặc CONFIRMED hợp lệ]</text>

    <line x1="426" y1="610" x2="674" y2="610" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="604" class="msg-txt">[09] Khởi tạo giao dịch hoàn kho: BEGIN TRANSACTION</text>

    <line x1="426" y1="645" x2="674" y2="645" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="639" class="msg-txt">[10] Cập nhật dữ liệu: UPDATE orders SET status = 'CANCELLED' WHERE id = @id</text>

    <line x1="426" y1="680" x2="674" y2="680" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="674" class="msg-txt">[11] Hoàn tồn kho nguyên tử: UPDATE product_variants SET stock = stock + qty</text>

    <line x1="426" y1="715" x2="674" y2="715" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="709" class="msg-txt">[12] Xác nhận giao dịch: COMMIT TRANSACTION</text>

    <line x1="674" y1="745" x2="426" y2="745" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="739" class="msg-txt">[13] Trả kết quả: Hủy đơn và hoàn tồn kho thành công</text>

    <line x1="414" y1="785" x2="166" y2="785" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="779" class="msg-txt">[14] Phản hồi thành công: 200 OK ("Hủy đơn hàng thành công, tồn kho đã hoàn lại")</text>
    

  <!-- FOOTER CHUẨN A4 -->
  <line x1="45" y1="1085" x2="795" y2="1085" class="line"/>
  <rect x="105" y="1092" width="110" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="160" y="1111" class="actor-lbl">Khách hàng</text>

  <rect x="360" y="1092" width="120" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="420" y="1111" class="actor-lbl">Hệ thống</text>

  <rect x="615" y="1092" width="130" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="680" y="1111" class="actor-lbl">Cơ sở dữ liệu</text>

  <text x="420.0" y="1145" class="footer-txt">Báo Cáo Đồ Án Tốt Nghiệp: Hệ Thống Thương Mại Điện Tử May Đo AURALIÈ | Chuẩn UML 2.x Sequence Diagram</text>
</svg>