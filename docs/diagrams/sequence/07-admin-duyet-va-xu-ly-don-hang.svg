<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 19.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .subtitle { font-family: 'Times New Roman', serif; font-size: 12.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .actor-lbl { font-family: 'Times New Roman', serif; font-size: 14.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .msg-txt { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .guard-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-weight: bold; fill: #000000; }
      .frame-lbl { font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .footer-txt { font-family: 'Times New Roman', serif; font-size: 11.5px; font-style: italic; fill: #000000; text-anchor: middle; }
      .line { stroke: #000000; stroke-width: 1.6; fill: none; }
      .lifeline { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 4,4; fill: none; }
      .activation { fill: #FFFFFF; stroke: #000000; stroke-width: 1.6; }
      .frame-box { fill: none; stroke: #000000; stroke-width: 1.3; }
      .divider { stroke: #000000; stroke-width: 1.1; stroke-dasharray: 4,4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Trang A4 Nền Trắng & Khung Viền -->
  <rect x="0" y="0" width="840" height="1188" fill="#FFFFFF"/>
  <rect x="25" y="25" width="790" height="1138" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Tiêu Đề -->
  <text x="420.0" y="58" class="title">SƠ ĐỒ TUẦN TỰ: QUẢN TRỊ VIÊN DUYỆT VÀ XỬ LÝ ĐƠN HÀNG</text>
  <text x="420.0" y="80" class="subtitle">Đặc tả quy trình nghiệp vụ 07 | Chuẩn UML 2.x | Hệ thống AURALIÈ | Hình 7 / 8</text>
  <line x1="45" y1="94" x2="795" y2="94" class="line"/>

  <!-- LIFELINE HEADERS -->
  
            <circle cx="160" cy="112" r="10" fill="none" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="122" x2="160" y2="142" stroke="#000000" stroke-width="1.8"/>
            <line x1="146" y1="130" x2="174" y2="130" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="142" x2="148" y2="158" stroke="#000000" stroke-width="1.8"/>
            <line x1="160" y1="142" x2="172" y2="158" stroke="#000000" stroke-width="1.8"/>
            <text x="160" y="176" class="actor-lbl">Quản trị viên</text>
            
  
            <rect x="345" y="118" width="150" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <text x="420" y="143" class="actor-lbl">Hệ thống</text>
            
  
            <path d="M 620 122 A 60 12 0 0 0 740 122 L 740 148 A 60 12 0 0 1 620 148 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <ellipse cx="680" cy="122" rx="60" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
            <text x="680" y="145" class="actor-lbl">Cơ sở dữ liệu</text>
            

  <!-- LIFELINES (Vertical Dashed Lines) -->
  <line x1="160" y1="185" x2="160" y2="1080" class="lifeline"/>
  <line x1="420" y1="185" x2="420" y2="1080" class="lifeline"/>
  <line x1="680" y1="185" x2="680" y2="1080" class="lifeline"/>

  <!-- NỘI DUNG TƯƠNG TÁC NGHIỆP VỤ -->
  
    <rect x="154" y="210" width="12" height="740" class="activation"/>
    <rect x="414" y="210" width="12" height="740" class="activation"/>

    <line x1="166" y1="230" x2="414" y2="230" class="line" marker-end="url(#arrow)"/>
    <text x="175" y="224" class="msg-txt">[01] Gửi yêu cầu xem đơn cần xuất may: GET /api/v1/orders?status=CONFIRMED</text>

    <path d="M 426 248 L 455 248 L 455 270 L 426 270" class="line" marker-end="url(#arrow)"/>
    <text x="462" y="262" class="msg-txt">[02] Xác thực và kiểm tra quyền: verifyToken() &amp; requireAdmin()</text>

    <!-- Alt: Admin Auth -->
    <rect x="55" y="290" width="730" height="580" class="frame-box"/>
    <polygon points="55,290 115,290 115,305 95,305 95,290" fill="#F4F4F4" stroke="#000000" stroke-width="0.8"/>
    <text x="65" y="302" class="frame-lbl">alt</text>
    <text x="125" y="302" class="guard-txt">[Tài khoản không có quyền Quản trị viên (role != 'ADMIN')]</text>

    <line x1="414" y1="330" x2="166" y2="330" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="324" class="msg-txt">[03] Phản hồi lỗi: 403 Forbidden ("Bạn không có quyền truy cập tính năng quản trị")</text>

    <line x1="55" y1="355" x2="785" y2="355" class="divider"/>
    <text x="125" y="370" class="guard-txt">[Quyền Quản trị viên hợp lệ và đã xác thực]</text>

    <rect x="674" y="375" width="12" height="390" class="activation"/>

    <line x1="426" y1="390" x2="674" y2="390" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="384" class="msg-txt">[04] Truy vấn dữ liệu: SELECT o.*, u.full_name, u.phone FROM orders o JOIN users u ...</text>

    <line x1="674" y1="435" x2="426" y2="435" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="429" class="msg-txt">[05] Trả kết quả: Danh sách đơn hàng đã thanh toán hoặc xác nhận COD</text>

    <line x1="414" y1="475" x2="166" y2="475" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="469" class="msg-txt">[06] Phản hồi thành công: 200 OK (Hiển thị danh sách lên bảng điều khiển)</text>

    <line x1="166" y1="535" x2="414" y2="535" class="line" marker-end="url(#arrow)"/>
    <text x="175" y="529" class="msg-txt">[07] Gửi yêu cầu duyệt đơn: PUT /api/v1/orders/:id/status { status: "PROCESSING" }</text>

    <path d="M 426 550 L 455 550 L 455 572 L 426 572" class="line" marker-end="url(#arrow)"/>
    <text x="462" y="564" class="msg-txt">[08] Kiểm tra tính hợp lệ luồng chuyển trạng thái: OrderService.updateOrderStatus()</text>

    <line x1="426" y1="620" x2="674" y2="620" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="614" class="msg-txt">[09] Cập nhật dữ liệu: UPDATE orders SET status = @status, updated_at = GETDATE() WHERE id = @id</text>

    <line x1="674" y1="660" x2="426" y2="660" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="435" y="654" class="msg-txt">[10] Trả kết quả: Xác nhận cập nhật trạng thái đơn (Rows affected = 1)</text>

    <line x1="414" y1="710" x2="166" y2="710" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
    <text x="175" y="704" class="msg-txt">[11] Phản hồi thành công: 200 OK ("Đã cập nhật trạng thái đơn hàng thành công!")</text>

    <line x1="426" y1="760" x2="674" y2="760" class="line" marker-end="url(#arrow)"/>
    <text x="435" y="754" class="msg-txt">[12] Thêm dữ liệu nhật ký vận hành: Ghi nhận thao tác của Quản trị viên</text>
    

  <!-- FOOTER CHUẨN A4 -->
  <line x1="45" y1="1085" x2="795" y2="1085" class="line"/>
  <rect x="105" y="1092" width="110" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="160" y="1111" class="actor-lbl">Quản trị viên</text>

  <rect x="360" y="1092" width="120" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="420" y="1111" class="actor-lbl">Hệ thống</text>

  <rect x="615" y="1092" width="130" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  <text x="680" y="1111" class="actor-lbl">Cơ sở dữ liệu</text>

  <text x="420.0" y="1145" class="footer-txt">Báo Cáo Đồ Án Tốt Nghiệp: Hệ Thống Thương Mại Điện Tử May Đo AURALIÈ | Chuẩn UML 2.x Sequence Diagram</text>
</svg>